version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-groundwork_web_1
      APP_PORT: 8080
      # Groundwork has its own login; the Android app and Claude's MCP client need direct access.
      PROXY_AUTH_ADD: "false"

  web:
    # 0.1.0, source ea726cc (main); public linux/amd64 image pinned by digest.
    image: ghcr.io/marguements/groundwork:sha-ea726cc@sha256:71b23f01b6b9ff18a9d302b70fdcff4a72583a2db37ba3ba1f001a65c7d92014
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      DATABASE_PATH: /data/groundwork.db
      JWT_SECRET: ${APP_GROUNDWORK_JWT_SECRET}
      TZ: America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data:/data

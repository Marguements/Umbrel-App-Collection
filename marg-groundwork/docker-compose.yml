version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-groundwork_web_1
      APP_PORT: 8080
      # Groundwork has its own login; the Android app and Claude's MCP client need direct access.
      PROXY_AUTH_ADD: "false"

  web:
    # Dev build from the Groundwork branch; switch to :<version>@sha256:<digest> at v0.1.0 (M5).
    image: ghcr.io/marguements/groundwork:sha-f06afad@sha256:16ae2659487a280a7a6ab24b0d825aa062ff832313e413a9040b52b813cc5ab7
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      DATABASE_PATH: /data/groundwork.db
      JWT_SECRET: ${APP_GROUNDWORK_JWT_SECRET}
      TZ: America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data:/data

version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-groundwork_web_1
      APP_PORT: 8080
      # Groundwork has its own login; the Android app and Claude's MCP client need direct access.
      PROXY_AUTH_ADD: "false"

  web:
    # Test release 2026-11-23, source e5a1f761 (main); verified public linux/amd64 image.
    image: ghcr.io/marguements/groundwork:0.1.0-test.20261123.1@sha256:22b55a244138e587ff72e2aede3075c8603cc64cfbb0b4388b90bc98bb813f2e
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      DATABASE_PATH: /data/groundwork.db
      JWT_SECRET: ${APP_GROUNDWORK_JWT_SECRET}
      TZ: America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data:/data

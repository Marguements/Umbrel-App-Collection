version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-groundwork_web_1
      APP_PORT: 8080
      # Groundwork has its own login; the Android app and Claude's MCP client need direct access.
      PROXY_AUTH_ADD: "false"

  web:
    # 0.2.1, source 970c7a6 (main); public linux/amd64 image pinned by digest.
    image: ghcr.io/marguements/groundwork:sha-970c7a6@sha256:2226e3ab43ad4b8dd465f4a9f189ca70960b77a08b3f5ad44a273dc7406176d9
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      DATABASE_PATH: /data/groundwork.db
      JWT_SECRET: ${APP_GROUNDWORK_JWT_SECRET}
      TZ: America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data:/data

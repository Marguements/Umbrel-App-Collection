version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-groundwork_web_1
      APP_PORT: 8080
      # Groundwork has its own login; the Android app and Claude's MCP client need direct access.
      PROXY_AUTH_ADD: "false"

  web:
    # 0.2.2 (upgrade safety), source bd323f5 (main); public linux/amd64 image pinned by digest.
    image: ghcr.io/marguements/groundwork:sha-bd323f5@sha256:f6cc6785d81058a8485621b6d71191f91830b2fae46460300379710ecbb4a4e4
    restart: on-failure
    init: true
    stop_grace_period: 1m
    environment:
      DATABASE_PATH: /data/groundwork.db
      JWT_SECRET: ${APP_GROUNDWORK_JWT_SECRET}
      TZ: America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data:/data

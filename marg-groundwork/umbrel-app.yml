repo: https://github.com/Marguements/Groundwork
support: https://github.com/Marguements/Groundwork/issues
port: 3050
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Groundwork now describes itself as based on the Getting Things Done method,
  with a trademark notice under Settings, About, and a reworded first coaching
  lesson. No database changes. The Android app (v0.2.5 APK on GitHub) fixes
  Process swipes, adds a Today option, a pinned Save and next button, and makes
  projects easy to create from the editor, Process and Lists.
submitter: Marguements

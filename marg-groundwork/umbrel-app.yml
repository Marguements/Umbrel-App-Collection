releaseNotes: >-
  New Groundwork logo and app icons across the web app and browser tab.
  Deleted items now go to a Trash for 30 days and can be restored (undo delete).
  Simple recurring tasks: completing a repeating task schedules its next occurrence.
  This update adds a database column (migration 0005); an automatic snapshot is
  saved to data/backups before migrating.

repo: https://github.com/Marguements/Groundwork
support: https://github.com/Marguements/Groundwork/issues
port: 3050
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Groundwork 0.2.0, built from main at fb11970. A calmer, redesigned web
  interface: four places (Today, Inbox, Lists, Reflect) instead of thirteen
  menu items, a capture field always at hand, Today with your three and what
  fits right now, a guided Process mode with an optional quick mode, progress
  shown as layers and 14-day consistency instead of streaks, and light and dark
  themes. No data changes; your lists and program carry over as they are.

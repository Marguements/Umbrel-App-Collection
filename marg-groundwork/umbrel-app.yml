id: marg-groundwork
category: productivity
name: Groundwork
version: "0.2.0"
tagline: Self-hosted GTD with habit coaching
description: >-
  A GTD task manager with an offline-first Android app, a web GUI, sync and a
  66-day habit program that coaches you into the method. Create your account
  on first launch.
developer: Marguements
website: https://github.com/Marguements/Groundwork

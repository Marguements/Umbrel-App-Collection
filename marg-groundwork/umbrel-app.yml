releaseNotes: >-
  Groundwork 0.2.2: safer updates. Before changing the database layout the
  server now saves a snapshot to data/backups, takes a first backup as soon as
  it starts, and refuses to start with an empty database if older data or
  backups are present. See docs/BACKUP.md for restoring, and copy backups off
  the Umbrel: uninstalling the app deletes them too. Built from main at bd323f5.

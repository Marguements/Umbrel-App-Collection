manifestVersion: 1.1
id: marg-groundwork
category: productivity
name: Groundwork
version: "0.2.4"
tagline: Self-hosted task manager with habit coaching
description: >-
  A calm task manager based on the Getting Things Done® method, with an
  offline-first Android app, a web GUI, sync and a 66-day coaching program.
  Create your account on first launch. GTD® and Getting Things Done® are
  registered trademarks of the David Allen Company; Groundwork is not
  affiliated with or endorsed by it.
developer: Marguements
website: https://github.com/Marguements/Groundwork
dependencies: []
repo: https://github.com/Marguements/Groundwork
support: https://github.com/Marguements/Groundwork/issues
port: 3050
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Every feature is open from day one: processing the Inbox, Daily Close, Weekly
  Review and the rest no longer wait for a later phase. The habit program is now
  optional coaching (daily tips and nudges) with a quick-start tour, a Coaching
  tips switch and Restart program in Settings. No database changes. The Android
  app (v0.2.4 APK on GitHub) adds tapping an item to view and edit it.
submitter: Marguements
submission: https://github.com/Marguements/Umbrel-App-Collection

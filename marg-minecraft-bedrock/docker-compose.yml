version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: marg-minecraft-bedrock_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  # Small info page so the app has something to open from the Umbrel dashboard.
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro

  server:
    # itzg/minecraft-bedrock-server downloads the official Bedrock Dedicated Server
    # at start. VERSION=LATEST keeps it in step with current Bedrock clients.
    image: itzg/minecraft-bedrock-server:latest
    restart: unless-stopped
    stop_grace_period: 1m
    stdin_open: true
    tty: true
    ports:
      # Bedrock is UDP only. Forward UDP 19132 on the router to this Umbrel.
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TZ: America/Chicago
      SERVER_NAME: "ArgueLab Bedrock"
      LEVEL_NAME: "ArgueLab"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      ONLINE_MODE: "true"
      ALLOW_CHEATS: "false"
      VIEW_DISTANCE: "10"
      TICK_DISTANCE: "4"
      # Set to "true" and add players to allowlist.json in data/ to make it invite-only.
      ALLOW_LIST: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/data

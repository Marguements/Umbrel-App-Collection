manifestVersion: 1.1
id: marg-minecraft-bedrock
category: gaming
name: Minecraft Bedrock Server
version: "1.1.0"
tagline: Dedicated Minecraft Bedrock Edition server
description: >-
  Runs the official Minecraft Bedrock Dedicated Server (via the
  itzg/minecraft-bedrock-server image) so phones, tablets, consoles and
  Windows players can join a world hosted on your Umbrel. Players connect on
  port 19132 through a WaterdogPE proxy, set up for playit.gg NetherNet
  tunnels (use with the playit.gg Agent app). Put the tunnel's NXS token in the
  NXS_TOKEN app setting. The world and server settings are stored in the app's data folder.
  By installing you accept the Minecraft EULA (https://aka.ms/MinecraftEULA).
developer: Marguements
website: https://github.com/itzg/docker-minecraft-bedrock-server
dependencies: []
repo: https://github.com/itzg/docker-minecraft-bedrock-server
support: https://github.com/Marguements/Umbrel-App-Collection/issues
port: 3060
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Adds a WaterdogPE proxy in front of the Bedrock server so it works with
  playit.gg NetherNet tunnels. The Bedrock server now listens only on
  127.0.0.1:19142 and WaterdogPE takes players on port 19132. Set the playit
  NXS token as NXS_TOKEN in the app settings (waterdog service).
submitter: Marguements
submission: https://github.com/Marguements/Umbrel-App-Collection
